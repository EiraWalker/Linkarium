<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>Linkarium 收藏状态</title><link rel="stylesheet" href="status.css"></head>
<body><main><h1>最近收藏</h1><p id="state" role="status">正在读取…</p><h2 id="title"></h2><p id="url"></p><p id="folder"></p><p id="error"></p><div><button id="refresh">刷新状态</button><button id="retry" hidden>重试</button><a id="library" href="https://link.eirawav.me/" target="_blank" rel="noopener">打开 Linkarium</a></div><p class="hint">点击工具栏图标保存网页；分类由本设备调用 API。Firefox 退出后暂停，重新打开后恢复。</p>
<h2>本设备 AI</h2><p id="executor-state" role="status"></p><p id="device-id" class="hint"></p>
<form id="local-config"><label>OpenAI 兼容 API 地址<input id="endpoint" type="url" placeholder="http://127.0.0.1:1234/v1" required></label><label>API 密钥<input id="api-key" type="password" autocomplete="off" placeholder="仅保存在本 Firefox 配置文件"></label><label><input id="keyless" type="checkbox">不使用密钥（明确清空已存密钥）</label><label>模型<input id="model" required maxlength="200"></label><label>输出模式<select id="mode"><option value="json_object">JSON object</option><option value="json_schema">JSON schema</option><option value="text">JSON 文本</option></select></label><button type="submit" id="validate">授权来源并验证</button></form><p id="config-result" role="status"></p><button id="resume">恢复本设备任务</button><button id="pause">暂停</button><p class="hint">密钥和完整结果只保存在本机，不使用浏览器同步。每次变更配置需重新验证；更换 API 来源时请重新输入密钥。未收到云端确认前保留完整响应，恢复时优先重传。</p>
</main><script src="common.js"></script><script src="model.js"></script><script src="status.js"></script></body></html>
